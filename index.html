<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crosschecker Rekening Pro - DANA TOTO Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* KONFIGURASI BACKGROUND GAMBAR DAN HD */
    :root {
      --bg-image: url('background-danatoto.png'); /* <--- INI ADALAH LINK KE GAMBAR ANDA */
      --card-bg: rgba(18, 24, 38, 0.93); /* Sedikit lebih gelap agar teks terbaca jelas */
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%);
      --accent-hover: linear-gradient(135deg, #4f46e5 0%, #2563eb 100%);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --input-bg: #0f172a;
      --success-bg: rgba(16, 185, 129, 0.15);
      --success-text: #10b981;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --danger-text: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    
    body {
      /* Mengatur Background Gambar */
      background-image: var(--bg-image);
      background-size: cover; /* Gambar menutupi seluruh layar */
      background-position: center; /* Gambar rata tengah */
      background-repeat: no-repeat; /* Gambar tidak mengulang */
      background-attachment: fixed; /* Gambar tetap saat di-scroll (HD feel) */
      
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .dashboard-card {
      width: 100%;
      max-width: 960px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 35px;
      box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.7); /* Bayangan lebih dramatis */
      backdrop-filter: blur(12px); /* Efek blur kaca lebih kuat */
    }

    .header { text-align: center; margin-bottom: 30px; }
    .header h2 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #ffffff, #c7d2fe); /* Warna gradien lebih terang */
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .header p { color: var(--text-sub); font-size: 14px; }

    .grid-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 25px;
    }

    @media (max-width: 768px) {
      .grid-inputs { grid-template-columns: 1fr; }
    }

    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-sub);
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      height: 180px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      color: #e2e8f0;
      font-size: 13px;
      line-height: 1.5;
      resize: vertical;
      outline: none;
      transition: all 0.2s ease;
    }

    textarea:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--accent-gradient);
      border: none;
      border-radius: 12px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    }

    .btn-submit:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
    }

    .results-section { margin-top: 35px; }
    .results-section h3 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 15px;
      color: var(--text-main);
    }

    .table-wrapper {
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
    }

    table { width: 100%; border-collapse: collapse; text-align: left; }
    th {
      background: rgba(255, 255, 255, 0.03);
      padding: 14px 18px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-sub);
      border-bottom: 1px solid var(--border-color);
    }
    td {
      padding: 14px 18px;
      font-size: 14px;
      border-bottom: 1px solid var(--border-color);
      color: #e2e8f0;
    }
    tr:last-child td { border-bottom: none; }

    .badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-success { background: var(--success-bg); color: var(--success-text); }
    .badge-danger { background: var(--danger-bg); color: var(--danger-text); }
  </style>
</head>
<body>

<div class="dashboard-card">
  <div class="header">
    <h2>CROSSCHECKER REKENING</h2>
    <p>Sistem audit otomatis data rekening situs vs admin - DANA TOTO</p>
  </div>
  
  <div class="grid-inputs">
    <div class="input-group">
      <label>1. Data Rekening (Situs)</label>
      <textarea id="dataSitus" placeholder="Tempelkan seluruh data dari website..."></textarea>
    </div>
    <div class="input-group">
      <label>2. Data Rekening (ADM)</label>
      <textarea id="dataAdm" placeholder="Tempelkan data mutasi / laporan ADM..."></textarea>
    </div>
  </div>
  
  <button class="btn-submit" onclick="prosesCheck()">Mulai Audit Otomatis</button>

  <div class="results-section">
    <h3>Hasil Analisis</h3>
    <div class="table-wrapper">
      <table id="tabelHasil">
        <thead>
          <tr>
            <th>Nomor Rekening</th>
            <th>Status Sistem</th>
            <th>Tindakan Rekomendasi</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td colspan="3" style="text-align:center; color: var(--text-sub);">Belum ada data untuk diperiksa.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
function prosesCheck() {
  const situsText = document.getElementById('dataSitus').value;
  const admText = document.getElementById('dataAdm').value;
  
  const rekSitus = Array.from(new Set(situsText.match(/\d{5,}/g) || []));
  const rekAdm = Array.from(new Set(admText.match(/\d{5,}/g) || []));
  
  const tbody = document.querySelector('#tabelHasil tbody');
  tbody.innerHTML = '';

  if (rekSitus.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color: var(--danger-text);">Tidak ada nomor rekening terdeteksi pada kolom Situs.</td></tr>';
    return;
  }

  rekSitus.forEach(noRek => {
    const adaDiAdm = rekAdm.includes(noRek);
    const row = `<tr>
      <td><strong style="letter-spacing: 0.5px;">${noRek}</strong></td>
      <td><span class="badge ${adaDiAdm ? 'badge-success' : 'badge-danger'}">${adaDiAdm ? 'Match (ADM)' : 'Unmatched'}</span></td>
      <td>${adaDiAdm ? '<span style="color: var(--text-sub);">Aman / Aktif</span>' : '<span style="color: var(--danger-text); font-weight:600;">Nonaktifkan</span>'}</td>
    </tr>`;
    tbody.innerHTML += row;
  });
}
</script>

</body>
</html>

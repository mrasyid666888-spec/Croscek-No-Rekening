<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CROSSCHECK REKENING ADM</title>
  <!-- Menggunakan Font Inter (Modern & Bersih) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* --- KONFIGURASI WARNA PREMIUM --- */
      /* Background Gelap Premium */
      --bg-dark: #080a10;
      
      /* Card Background (Glassmorphism Effect - Lebih Transparan & nge-Blur) */
      --card-bg: rgba(25, 30, 45, 0.65);
      --card-blur: blur(20px);
      --card-border: 1px solid rgba(255, 255, 255, 0.08);
      
      /* Gradien Aksen (Biru-Ungu Mewah) */
      --accent-gradient: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
      --accent-hover: linear-gradient(135deg, #4338ca 0%, #0891b2 100%);
      
      /* Warna Teks */
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
      
      /* Input & Elemen Lain */
      --input-bg: rgba(10, 15, 25, 0.8);
      --input-border: 1px solid rgba(255, 255, 255, 0.1);
      
      /* Status Badges */
      --success-bg: rgba(16, 185, 129, 0.15);
      --success-text: #10b981;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --danger-text: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    
    body {
  background-color: #080a10;
  background-image: 
    linear-gradient(135deg, rgba(8, 10, 16, 0.75) 0%, rgba(15, 20, 35, 0.75) 100%),
    url('download.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 40px 20px;
}

    .dashboard-card {
      width: 100%;
      max-width: 1000px;
      background: var(--card-bg);
      backdrop-filter: var(--card-blur);
      -webkit-backdrop-filter: var(--card-blur);
      border: var(--card-border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
    }

    .header { text-align: center; margin-bottom: 40px; }
    .header h2 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
      /* Gradien Teks Mewah */
      background: linear-gradient(to right, #ffffff, #94a3b8, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }
    .header p { 
      color: var(--text-sub); 
      font-size: 15px; 
      font-weight: 300;
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.6;
    }

    .grid-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
      margin-bottom: 30px;
    }

    @media (max-width: 768px) {
      .grid-inputs { grid-template-columns: 1fr; gap: 20px; }
      .dashboard-card { padding: 30px 20px; }
    }

    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-sub);
      margin-bottom: 12px;
    }

    textarea {
      width: 100%;
      height: 200px;
      background: var(--input-bg);
      border: var(--input-border);
      border-radius: 16px;
      padding: 16px;
      color: #e2e8f0;
      font-size: 14px;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      transition: all 0.2s ease;
    }

    textarea:focus {
      border-color: #06b6d4;
      box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.15);
    }

    .btn-submit {
      width: 100%;
      padding: 18px;
      background: var(--accent-gradient);
      border: none;
      border-radius: 16px;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 25px -5px rgba(6, 182, 212, 0.4);
    }

    .btn-submit:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px -5px rgba(6, 182, 212, 0.5);
    }

    .results-section { 
      margin-top: 45px; 
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 35px;
    }
    .results-section h3 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .table-wrapper {
      background: rgba(10, 15, 25, 0.5);
      border: var(--input-border);
      border-radius: 16px;
      overflow-x: auto; /* Untuk responsivitas tabel */
    }

    table { width: 100%; border-collapse: collapse; text-align: left; min-width: 600px; }
    th {
      background: rgba(255, 255, 255, 0.02);
      padding: 18px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-sub);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    td {
      padding: 18px;
      font-size: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      color: #e2e8f0;
      font-weight: 400;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255, 255, 255, 0.01); }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-success { background: var(--success-bg); color: var(--success-text); border: 1px solid rgba(16, 185, 129, 0.2); }
    .badge-danger { background: var(--danger-bg); color: var(--danger-text); border: 1px solid rgba(239, 68, 68, 0.2); }
  </style>
</head>

    <div class="input-group">
      <label>2. Data Referensi (ADM/Mutasi)</label>
      <textarea id="dataAdm" placeholder="Tempelkan data mutasi atau laporan ADM untuk verifikasi..."></textarea>
    </div>
  </div>
  
  <button class="btn-submit" onclick="prosesCheck()">Mulai Audit Otomatis</button>

  <div class="results-section">
    <h3>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 12L11 14L15 10M12 3C17 3 21 7 21 12C21 17 17 21 12 21C7 21 3 17 3 12C3 7 7 3 12 3Z" stroke="#f1f5f9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Hasil Analisis Audit
    </h3>
    <div class="table-wrapper">
      <table id="tabelHasil">
        <thead>
          <tr>
            <th>Nomor Rekening</th>
            <th>Status Verifikasi</th>
            <th>Rekomendasi Tindakan</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td colspan="3" style="text-align:center; color: var(--text-sub); padding: 30px; font-style: italic;">Sistem siap. Masukkan data di atas untuk memulai audit.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
function prosesCheck() {
  const situsText = document.getElementById('dataSitus').value;
  const admText = document.getElementById('dataAdm').value;
  
  const rekSitus = Array.from(new Set(situsText.match(/\d{5,}/g) || []));
  const rekAdm = Array.from(new Set(admText.match(/\d{5,}/g) || []));
  
  const tbody = document.querySelector('#tabelHasil tbody');
  tbody.innerHTML = '';

  rekSitus.forEach(noRek => {
    const adaDiAdm = rekAdm.includes(noRek);
    
    // Jika MATCH (ada di ADM), tampilkan SEGERA DIOFFKAN dengan warna merah
    const row = `<tr>
      <td><strong style="letter-spacing: 0.5px; font-weight: 600;">${noRek}</strong></td>
      <td><span class="badge ${adaDiAdm ? 'badge-danger' : 'badge-success'}">${adaDiAdm ? 'MATCH' : 'TIDAK COCOK'}</span></td>
      <td>${adaDiAdm ? '<span style="color: var(--danger-text); font-weight:700; text-transform: uppercase;">⚠️ SEGERA DIOFFKAN</span>' : '<span style="color: var(--text-sub);">Aman / Aktif</span>'}</td>
    </tr>`;
    tbody.innerHTML += row;
  });
}
</script>
